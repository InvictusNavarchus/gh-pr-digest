[package]
name = "gh-pr-digest"
version = "0.1.0"
edition = "2024"
description = "Download GitHub PR reviews, inline threads, and comments to Markdown"
repository = "https://github.com/InvictusNavarchus/gh-pr-digest"
categories = ["command-line-utilities", "development-tools"]
keywords = ["github", "pull-request", "review", "cli", "gh-extension"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
ureq = { version = "3.4.1", features = ["json"] }

[profile.release]
# A CLI people install once and run for years: trade build time for a small,
# fast binary. `panic = "abort"` is safe here because nothing catches unwinds.
lto = true
codegen-units = 1
strip = true
panic = "abort"
