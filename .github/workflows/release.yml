name: Release
#
# The ritual:
#   1. Each change adds its entry under Unreleased in CHANGELOG.md.
#   2. `cargo release` renames that section to the new version and pushes a v*
#      tag, which starts this workflow.
#   3. It builds all five targets, then publishes the release with the binaries
#      attached and that section as its notes.
#
# Nothing here waits on a human, so do not create releases in the web UI: a
# release that is already published when this runs fails the workflow.
#
# Publication is deliberately the last step. Triggering on `release: published`
# instead would mean the release goes public the moment the workflow starts,
# leaving several minutes in which `gh extension install` resolves a release
# that has no binaries attached yet.

on:
  push:
    tags: ["v*"]
  # Lets the whole matrix be rehearsed without cutting a release, so that a
  # broken runner image is discovered deliberately rather than at tag time.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      # Report every broken target in one run rather than only the first.
      fail-fast: false
      matrix:
        include:
          # `asset` must be `<os>-<arch>` in Go's vocabulary: that is the suffix
          # `gh extension install` matches on when picking a binary.
          #
          # Runner images are pinned, not `-latest`. GitHub repoints the latest
          # labels on its own schedule -- `macos-latest` became macOS 26 in June
          # 2026, `windows-latest` moved to VS 2026 -- and a release workflow
          # that only runs on a tag would discover that mid-release. Pinned
          # images are retired loudly, with a deprecation window; drifting ones
          # change under you silently.
          - { runner: ubuntu-24.04,  target: x86_64-unknown-linux-musl,  asset: linux-amd64,       cross: true }
          - { runner: ubuntu-24.04,  target: aarch64-unknown-linux-musl, asset: linux-arm64,       cross: true }
          - { runner: macos-15,      target: aarch64-apple-darwin,       asset: darwin-arm64,      cross: false }
          - { runner: macos-15,      target: x86_64-apple-darwin,        asset: darwin-amd64,      cross: false }
          - { runner: windows-2022,  target: x86_64-pc-windows-msvc,     asset: windows-amd64.exe, cross: false }

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl gives a statically linked Linux binary, which is the whole point of
      # shipping a standalone tool: no glibc version to match at the far end.
      - uses: taiki-e/install-action@v2
        if: matrix.cross
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      - name: Stage the asset
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/gh-pr-digest"
          if [ -f "$binary.exe" ]; then
            binary="$binary.exe"
          fi

          mkdir -p dist
          # The name and tag in front of the platform suffix are for humans
          # reading the release page; only the suffix is load-bearing.
          cp "$binary" "dist/gh-pr-digest_${GITHUB_REF_NAME}_${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    # Only a tag publishes a release; a manual run is a rehearsal that stops
    # after the binaries have been proven to build.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksum
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      # The pre-release-hook already refused an empty section before the tag
      # was pushed; this is the backstop for a tag that did not come from
      # `cargo release`.
      - name: Extract the release notes
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md

      # Assembly happens once, after every target has built. Uploading as each
      # target finished would leave the release briefly advertising a platform
      # whose binary had not arrived yet. For the same reason the release is
      # built up as a draft and only flipped public once the uploads are done.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"

          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::$tag was published before this workflow attached its binaries; anyone who installed in between hit a release with no assets. Releases are published from here, not from the web UI."
              exit 1
            fi
            # A draft left behind by an earlier run of this workflow that failed
            # partway, now being re-run: take it over.
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" \
              --draft \
              --title "$tag" \
              --notes-file notes.md \
              --verify-tag
          fi

          gh release upload "$tag" dist/* --clobber
          gh release edit "$tag" --draft=false

          echo "Published: $(gh release view "$tag" --json url --jq .url)"
